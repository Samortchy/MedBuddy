<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="medgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#medgrad)"/>
  <!-- heartbeat / pulse line -->
  <polyline points="9,27 21,27 26,16 33,38 39,27 55,27"
            fill="none" stroke="#FFFFFF" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <!-- MED wordmark -->
  <text x="32" y="51" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="20"
        font-weight="700" letter-spacing="1.5" fill="#FFFFFF">MED</text>
</svg>
