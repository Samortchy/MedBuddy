org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compilation breaks when the project (D:) and the Pub cache
# (C:) are on different Windows drives ("this and base files have different roots").
# Disable it to avoid the cross-drive cache crash.
kotlin.incremental=false
